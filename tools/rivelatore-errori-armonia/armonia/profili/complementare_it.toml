nome = "complementare_it"
versione = "0.1.0"
descrizione = "Convenzioni iniziali di armonia tonale scolastica SATB; non validate per una commissione specifica."
convenzioni = [
  "Il basso del file è il basso dato; non è disponibile il confronto con la consegna originale.",
  "Parallele su tutte le sei coppie e sulla superficie; intervalli riconosciuti anche nell’ortografia e nei composti.",
  "Dirette esterne vietate con salto diatonico del soprano oltre la seconda; parti interne da verificare.",
  "Moto contrario e quinte disuguali sono categorie autonome da verificare, non parallele certe.",
  "Distanza massima S–A e A–T: ottava; T–B oltre dodicesima è solo avvertimento.",
  "Sincope: identità scritta dell’accordo dal debole al forte, indipendente da rivolto e riarticolazione; eccezioni cadenzali e pedali da verificare.",
  "Regole armoniche condizionate alle ipotesi, senza divieto generale di raddoppiare la terza.",
  "Interruzioni e fermate sospendono i collegamenti; note ribattute non producono moto.",
]
fonti = [
  "Convenzioni operative di PROGETTO.md: non sostituiscono il programma del docente.",
  "Open Music Theory, Basso Continuo: https://openmusictheory.github.io/bassoContinuo.html",
  "Liceo Bertolucci, Lezioni di armonia: https://www.liceoattiliobertolucci.edu.it/wp-content/uploads/2023/11/Lezioni-di-armonia.pdf",
  "C. E. Cella, Appunti di armonia: https://www.carminecella.com/teaching/note_armonia.pdf",
]

[soglie]
spaziatura_superiori = 12
spaziatura_basso_avviso = 19
salto_massimo = 12

[estensioni]
S = ["C4", "A5"]
A = ["G3", "D5"]
T = ["C3", "G4"]
B = ["E2", "C4"]

# Fonte "profilo" indica una convenzione dichiarata, non una norma universale.
[regole]
VL-P5 = { titolo = "Quinte parallele", gravita = "errore", attiva = true, disponibile = true, definizione = "Due quinte giuste, anche composte, con entrambe le voci in moto retto.", eccezioni = "Pause, fermate, moto obliquo, contrario e quinte diminuite esclusi.", fonte = "profilo; Open Music Theory", esempi = "C3/G4→D3/A4 vietato; B2/F4→C3/G4 non è parallela giusta." }
VL-P8 = { titolo = "Ottave e unisoni consecutivi", gravita = "errore", attiva = true, disponibile = true, definizione = "Due intervalli della famiglia perfetta di unisono/ottava, anche composti, in moto retto.", eccezioni = "Unisono fermo e moto contrario esclusi; tipologie degli intervalli riportate.", fonte = "profilo", esempi = "C3/C4→D3/D4 vietato; C3/C4→C3/E4 ammesso da questa regola." }
VL-CONTRARY = { titolo = "Intervalli perfetti per moto contrario", gravita = "osservazione", attiva = true, disponibile = true, definizione = "Quinte o ottave consecutive con parti in direzioni opposte.", eccezioni = "Trattamento da concordare col docente; nessun errore confermato.", fonte = "profilo", esempi = "C3/G4→D2/A4 da verificare; moto obliquo escluso." }
VL-DIRECT = { titolo = "Quinte e ottave dirette", gravita = "errore", attiva = true, disponibile = true, definizione = "Moto retto da altra famiglia intervallare verso quinta/ottava, con salto superiore oltre seconda.", eccezioni = "Soprano per grado congiunto ammesso; parti interne da verificare.", fonte = "profilo; Open Music Theory", esempi = "C3/E4→D3/A4 vietato; arrivo con soprano congiunto ammesso." }
VL-UNEQUAL = { titolo = "Quinte disuguali", gravita = "avvertimento", attiva = true, disponibile = true, definizione = "Passaggio da quinta diminuita a giusta in moto retto.", eccezioni = "Direzione inversa esclusa; trattamento delle coppie e risoluzioni da verificare.", fonte = "profilo", esempi = "B2/F4→C3/G4 da verificare; C3/G4→B2/F4 escluso." }
VL-CROSS = { titolo = "Incrocio delle voci", gravita = "errore", attiva = true, disponibile = true, definizione = "Una voce adiacente inferiore supera la superiore.", eccezioni = "Unisono ammesso; identità vocali conservate.", fonte = "profilo", esempi = "S=C4,A=E4 vietato; S=E4,A=E4 ammesso." }
VL-OVERLAP = { titolo = "Sovrapposizione delle voci", gravita = "errore", attiva = true, disponibile = true, definizione = "Una voce oltrepassa la posizione precedente di quella adiacente.", eccezioni = "Pause, fermate e uguaglianza escluse.", fonte = "profilo", esempi = "S=G4,A=E4→S=A4,A=A4: A supera il precedente G4." }
VL-SPACE = { titolo = "Distanza fra le voci superiori", gravita = "errore", attiva = true, disponibile = true, definizione = "Oltre 12 semitoni fra S–A oppure A–T.", eccezioni = "Ottava esatta ammessa; T–B separato.", fonte = "profilo", esempi = "S=C5,A=B3 vietato; S=C5,A=C4 ammesso." }
VL-BASS-SPACE = { titolo = "Distanza tenore–basso", gravita = "avvertimento", attiva = true, disponibile = true, definizione = "Distanza T–B oltre 19 semitoni.", eccezioni = "Non è un errore formale automatico.", fonte = "profilo", esempi = "T=C4,B=C2 avviso; T=G3,B=C2 entro soglia." }
ME-RANGE = { titolo = "Estensione vocale", gravita = "avvertimento", attiva = true, disponibile = true, definizione = "Altezza esterna alle estensioni dichiarate.", eccezioni = "Limiti inclusi; scomodità, non divieto universale.", fonte = "profilo", esempi = "S=B5 avviso; S=A5 entro registro." }
ME-LEAP = { titolo = "Salto melodico problematico", gravita = "avvertimento", attiva = true, disponibile = true, definizione = "Salto oltre ottava o intervallo aumentato/diminuito oltre unisono.", eccezioni = "Semitono cromatico ammesso; seconda aumentata minore segnalata con cautela.", fonte = "profilo", esempi = "C4/D5 avviso; C4/G4 entro soglia." }
ME-RECOVERY = { titolo = "Recupero del salto", gravita = "avvertimento", attiva = true, disponibile = true, definizione = "Salto di quinta o maggiore non seguito da grado congiunto contrario.", eccezioni = "Pause, fermate e fine frase escluse.", fonte = "profilo", esempi = "C4/G4/A4 avviso; C4/G4/F4 ammesso." }
HA-CHROMATIC = { titolo = "Relazione cromatica", gravita = "avvertimento", attiva = true, disponibile = true, definizione = "Stesso nome diatonico con alterazioni differenti fra parti simultanee o armonie contigue.", eccezioni = "Cromatismo nella stessa voce escluso dalle relazioni successive; modulazioni e gradi mobili da verificare.", fonte = "profilo", esempi = "F in una voce e F# in altra da verificare; F→F# nella stessa voce escluso." }
HA-TRITONE = { titolo = "False relazioni di tritono", gravita = "osservazione", attiva = true, disponibile = false, definizione = "Fattispecie trasversali vietate dal programma d’esame.", eccezioni = "Non basta il tritono; norma precisa non fornita.", fonte = "PROGETTO.md", esempi = "Da definire e validare con il docente." }
HA-LEADING-DOUBLE = { titolo = "Raddoppio della sensibile", gravita = "errore", attiva = true, disponibile = true, definizione = "Sensibile locale raddoppiata in accordo di dominante o settima di sensibile.", eccezioni = "Applicazione condizionata al centro tonale e alla funzione.", fonte = "profilo", esempi = "G/B/B/D in Do da correggere; G/B/D/G non raddoppia B." }
HA-LEADING = { titolo = "Risoluzione della sensibile", gravita = "errore", attiva = true, disponibile = true, definizione = "Sensibile della dominante non sale alla tonica quando segue un accordo di tonica.", eccezioni = "Prolungamenti esclusi; discesa di terza in parte interna segnalata come eccezione da verificare.", fonte = "profilo", esempi = "B→C ammesso in V–I di Do; B→A non risolve." }
HA-SEVENTH = { titolo = "Risoluzione della settima", gravita = "errore", attiva = true, disponibile = true, definizione = "Settima accordale non scende di grado al cambiamento di armonia.", eccezioni = "Note tenute e prolungamenti rinviati; risoluzioni eccezionali da verificare.", fonte = "profilo", esempi = "F→E in G7–C ammesso; F→G da correggere." }
HA-PREPARATION = { titolo = "Preparazione delle settime", gravita = "avvertimento", attiva = true, disponibile = true, definizione = "Settima non di dominante priva di preparazione per nota comune consonante.", eccezioni = "Dominante non richiede questa preparazione; altre specie da verificare.", fonte = "profilo", esempi = "F non preparato in ii7 di Do da verificare; settima di dominante esclusa." }
HA-DOUBLING = { titolo = "Raddoppio di dissonanza", gravita = "errore", attiva = true, disponibile = true, definizione = "Raddoppio della settima di un accordo riconosciuto.", eccezioni = "Non si vieta in generale il raddoppio della terza.", fonte = "profilo", esempi = "G/B/F/F da verificare con lettura incompleta; G/B/D/F ammesso." }
HA-INCOMPLETE = { titolo = "Accordi incompleti", gravita = "osservazione", attiva = true, disponibile = true, definizione = "Doppio suono o accordo non riconosciuto: note essenziali non determinabili.", eccezioni = "Pause e figurazioni motivate distinguibili; nessuna omissione dichiarata errore certo.", fonte = "profilo", esempi = "C/G soli non determinano univocamente la terza; C/E/G triade completa." }
HA-64 = { titolo = "Quarta e sesta", gravita = "osservazione", attiva = true, disponibile = true, definizione = "Triade in secondo rivolto classificata come cadenza, passaggio, pedale o indeterminata.", eccezioni = "Classificazioni ipotetiche; altre forme e loro grammatica non disponibili.", fonte = "profilo", esempi = "I64–V con basso sul V: cadenza ipotizzata; basso congiunto su debole: passaggio." }
HA-INV7 = { titolo = "Basso del terzo rivolto di settima", gravita = "errore", attiva = true, disponibile = true, definizione = "Basso di un accordo di settima in terzo rivolto non scende di grado al cambio di armonia.", eccezioni = "Solo terzo rivolto riconosciuto; altri rivolti affidati alle risoluzioni dei suoni obbligati.", fonte = "profilo", esempi = "V42 con F→E in Do ammesso; F→G da verificare." }
HA-FIGURATION = { titolo = "Figurazioni", gravita = "osservazione", attiva = true, disponibile = true, definizione = "Riduzione motivata da preparazione, accento e risoluzione di una nota estranea.", eccezioni = "Una figurazione superiore per segmento; riduzioni multiple e ornamenti nel basso non determinabili.", fonte = "profilo", esempi = "E–F–G su Do: passaggio debole; nota dissonante senza contesto non eliminata." }
HR-SYNC = { titolo = "Sincope armonica", gravita = "avvertimento", attiva = true, disponibile = true, definizione = "Stessa identità accordale iniziata sul debole e presente a un accento più forte.", eccezioni = "Anacrusi, pedale, formula cadenzale e riduzione incerta da verificare; rivolto e riattacco non esentano.", fonte = "profilo; Liceo Bertolucci", esempi = "Accordo dal tempo 4 al battere: avviso; accordo iniziato sul battere e tenuto: escluso." }
HA-CONNECTION = { titolo = "Collegamento funzionale", gravita = "osservazione", attiva = true, disponibile = true, definizione = "Cadenze V–I, V–VI e IV/ii–V sono letture compatibili; V–IV è dubbio contestuale.", eccezioni = "Mai un divieto universale basato su due soli gradi; progressioni/pedali da verificare.", fonte = "profilo; Cella", esempi = "V–I compatibile condizionalmente; V–IV da verificare." }
HA-GRAMMAR = { titolo = "Grammatica estesa", gravita = "osservazione", attiva = true, disponibile = false, definizione = "Giudizio completo su sequenze ed eccezioni di repertorio (rilevamento delle progressioni: PR-RILEVATA).", eccezioni = "Repertorio e programma del docente non specificati.", fonte = "PROGETTO.md", esempi = "Da validare su corpus annotato dal docente." }
HA-MODULATION = { titolo = "Cromatismo e tonicizzazioni", gravita = "osservazione", attiva = true, disponibile = true, definizione = "Dominante secondaria con risoluzione osservata e cambi di armatura come indizi locali.", eccezioni = "Modulazione senza armatura e accordi alterati diversi dalle dominanti secondarie non certificati.", fonte = "profilo", esempi = "D7–G in Do suggerisce V/V; F# isolato non è automaticamente errore." }
HA-ALTERED = { titolo = "Accordi alterati e modulazioni estese", gravita = "osservazione", attiva = true, disponibile = false, definizione = "Scambi modali e modulazioni per reinterpretazione enarmonica.", eccezioni = "Seste eccedenti e napoletana sono coperte da RS-ECCEDENTE e RS-NAPOLETANA; scambi modali, enarmonia e accordi alterati diversi non definiti.", fonte = "PROGETTO.md", esempi = "Da validare con il docente; non giudicare errata ogni alterazione." }
