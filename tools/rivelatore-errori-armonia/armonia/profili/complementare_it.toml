RS-RITARDO = { titolo = "Preparazione e risoluzione del ritardo", gravita = "errore", attiva = true, disponibile = true, definizione = "Nota estranea tenuta dall'armonia precedente: deve essere preparata da nota consonante e scendere di grado sull'armonia successiva.", eccezioni = "Ritardo ascendente (sensibile) e appoggiature da verificare; una voce alla volta.", fonte = "profilo; manuale cap. 10", esempi = "4–3 con la quarta tenuta e risolta di grado discendente: corretto." }
