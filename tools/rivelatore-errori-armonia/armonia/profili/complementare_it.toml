HA-SYMBOL = { titolo = "Confronto con simbolo accordale", gravita = "avvertimento", attiva = true, disponibile = true, definizione = "Differenza fra note strutturali e note del simbolo importato.", eccezioni = "Annotazione non autorevole; omissioni ammesse da verificare.", fonte = "profilo", esempi = "C dichiarato con F# strutturale: discrepanza; C/E/G coerente con C." }
CA-TIPO = { titolo = "Tipo di cadenza", gravita = "osservazione", attiva = true, disponibile = true, definizione = "Classificazione della formula che chiude una frase o l'esempio: perfetta (V–I in stato fondamentale, soprano sulla tonica), imperfetta, plagale (IV–I), sospesa (–V), d'inganno (V–VI), frigia (iv6–V), evitata (V–altro).", eccezioni = "Solo ultima armonia della frase o dell'esempio (o armonia con fermata); cadenze interne non classificate; tonalità estimata se non dichiarata.", fonte = "profilo; manuale cap. 6", esempi = "V–I con soprano sulla tonica: perfetta; V6–I: imperfetta; IV–V: sospesa." }
CA-FINALE = { titolo = "Chiusura della frase", gravita = "osservazione", attiva = true, disponibile = true, definizione = "Fine frase senza formula cadenzale riconosciuta, oppure tonica finale non in stato fondamentale.", eccezioni = "Esempi di frammento (non frase) o progressioni in corso possono legittimamente non chiudere.", fonte = "profilo", esempi = "ii–I finale: nessuna formula; V–I6 finale: tonica non fondamentale." }
RS-NAPOLETANA = { titolo = "Risoluzione della sesta napoletana", gravita = "errore", attiva = true, disponibile = true, definizione = "II abbassato maggiore, di norma in primo rivolto, risolve su V (anche tramite I6/4); la fondamentale scende di terza diminuita alla sensibile.", eccezioni = "Risoluzione su vii°7 o, in altri contesti, su altri accordi: osservazione da verificare.", fonte = "profilo; manuale cap. 21", esempi = "II$\\flat$6–V–i corretto; II$\\flat$6–IV errore." }
RS-ECCEDENTE = { titolo = "Risoluzione delle seste eccedenti", gravita = "errore", attiva = true, disponibile = true, definizione = "Sesta italiana, francese o tedesca (basso sul VI abbassato, IV alzato) risolvono su V (anche tramite I6/4): basso e IV alzato convergono per semitono sulla dominante.", eccezioni = "Sesta tedesca su V diretto: osservazione sulle quinte; riconoscimento per classi di altezza e ortografia (sesta aumentata scritta).", fonte = "profilo; manuale cap. 22", esempi = "Fa–Re$\\sharp$ su La minore: risolve su Mi–Mi." }
