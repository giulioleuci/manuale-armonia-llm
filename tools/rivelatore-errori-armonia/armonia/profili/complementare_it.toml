MO-RILEVATA = { titolo = "Modulazione", gravita = "osservazione", attiva = true, disponibile = true, definizione = "Cambio del centro tonale: cadenza V–I in un tono diverso con permanenza (o chiusura) nel nuovo tono, oppure cambio dichiarato di tonalità. Indica relazione fra i toni e accordo pivot.", eccezioni = "Modulazioni senza cadenza di conferma o per reinterpretazione enarmonica non rilevate; il pivot è la prima armonia della catena comune.", fonte = "profilo; manuale cap. 16", esempi = "I–IV–II7–V–I in Do che arriva a Sol: modulazione al tono della dominante." }
